<h1 class="page-title">Projects</h1>

<!-- project rows built dynamically by initProjects() in projectLoader.js-->
<div class="project-list"></div>

<!-- template for a each individual project in the row on first project page-->
<template id="project-row-template">
    <div class="project-row">
        <span class="project-row-icon"></span>
        <div class="project-row-body">
            <div class="project-row-title-line">
                <span class="project-row-name"></span>
                <span class="project-row-year"></span>
            </div>
            <p class="project-row-meta"></p>
        </div>
        <span class="project-row-arrow">›</span>
    </div>

</template>

<!-- template for project detail page -->
<template id="project-detail-template">
    <button class="project-detail-back" onclick="loadPage('projects'); history.pushState(null,'','#projects');">‹ back to projects</button>

    <h2 class="project-detail-title"></h2>
    <p class="project-detail-meta"></p>

    <div class="project-screenshots"></div>

    <p class="project-detail-description"></p>
    <a class="project-detail-link" href="#" target="_blank"></a>

</template>
